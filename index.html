<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#101513" />
  <title>MENTAL TRADER</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="./style.css?v=4" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./assets/logo.png?v=4" alt="MENTAL TRADER logo" class="brand-logo"
             onerror="this.style.display='none';document.getElementById('brandLogoFallback').style.display='grid';" />
        <span id="brandLogoFallback" class="brand-logo-fallback" aria-hidden="true">MT</span>
        <div class="brand-copy">
          <span class="eyebrow">MENTAL TRADER</span>
          <strong>Trading Signals</strong>
        </div>
      </div>
      <div id="planBadge" class="plan-badge">Checking…</div>
    </header>

    <main id="main" class="main-content" aria-live="polite">
      <section class="center-state">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Connecting to Telegram</h1>
        <p>Checking your account and subscription.</p>
      </section>
    </main>

    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Main navigation">
      <button type="button" data-nav="markets" class="nav-item active">
        <span class="nav-icon">◫</span><span>Markets</span>
      </button>
      <button type="button" data-nav="signal" class="nav-item">
        <span class="nav-icon">↗</span><span>Signal</span>
      </button>
      <button type="button" data-nav="profile" class="nav-item">
        <span class="nav-icon">○</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="./config.js?v=4"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
